- uuid: ImsMVRAdlk
  name: Extract stim-aligned spike times per trial with block labels for QC-passing
    units into compact per-session files.
  mime_type: text/markdown
  url: file:///Users/pavir/Code/dr-interactive-interface/work/precompute-aligned-spikes/README.md
  summary: Produce the compact spike data the Shiny app will read instead of the multi-GB
    NWB files. For each session, for every unit passing default_qc, extract spike
    times aligned to stim_start_time for every trial in the DynamicRouting task epoch
    within a -2.0 to +3.0 s window. Store per-session units, trials, and aligned-spikes
    parquet tables under data/precomputed/<session_id>/.
  tags:
  - asta-assistant
  - work
  - precompute-aligned-spikes
  created_at: '2026-09-14T22:42:23.488938+00:00'
  modified_at: '2026-09-14T22:42:23.488938+00:00'
  extra: null
- uuid: QnfIRbjMQv
  name: Per unit, test pre-stimulus baseline rate in aud vs vis blocks; output a table
