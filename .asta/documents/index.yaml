- uuid: gsf4iX1H0m
  name: Create code/ and data/precomputed/ layout, a config module exposing DATA_DIR,
    and a reproducible script that scans all NWB sessions into a session/unit manifest.
  mime_type: text/markdown
  url: file:///Users/pavir/Code/dr-interactive-interface/work/project-scaffold-and-inventory/README.md
  summary: Establish the reproducible project layout and a data inventory. Create
    code/ and data/precomputed/ directories, and a small config module (code/config.py)
    that exposes DATA_DIR (defaulting to nwb_sessions/ at the repo root, overridable
    via an environment variable) and PRECOMPUTED_DIR (data/precomputed/). Add a dependency
    manifest listing pynwb/h5py, numpy, pandas, pyarrow, scipy, plotly, and shiny.
  tags:
  - asta-assistant
  - work
  - project-scaffold-and-inventory
