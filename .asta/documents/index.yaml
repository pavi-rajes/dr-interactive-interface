- uuid: eWKXigAHKG
  name: Per unit, compare early post-switch trials vs late-block trials in both switch
    directions; output a table of rule-updating units for tab 2.
  mime_type: text/markdown
  url: file:///Users/pavir/Code/dr-interactive-interface/work/rule-change-unit-analysis/README.md
  summary: Identify units that respond specifically to rule changes (block switches)
    by contrasting early vs late trials within switch blocks, per direction and pooled,
    in baseline and evoked windows, with a detrended stratified chunk-permutation
    test; outputs rule_change_units.parquet (is_rule_updating default flag), switch-aligned
    profiles and region summaries.
  tags:
  - asta-assistant
  - work
  - rule-change-unit-analysis
  created_at: '2026-09-14T23:26:33.887458+00:00'
