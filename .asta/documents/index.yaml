- uuid: aacueifDSs
  name: 'Build the Shiny app with both tabs wired to precomputed tables: selectors,
    3D brain, raster, and PSTH plots.'
  mime_type: text/markdown
  url: file:///Users/pavir/Code/dr-interactive-interface/work/shiny-app-tabs/README.md
  summary: 'Python Shiny application (code/app.py) with two tabs: context-dependent
    baseline shifts and rule-change units. Left: session/region/unit selectors, analysis
    window, rasters and PSTHs per context, per-trial rates or switch-aligned profiles.
    Right: interactive 3D CCF brain with flagged units and click-to-select. Reads
    only precomputed artifacts.'
