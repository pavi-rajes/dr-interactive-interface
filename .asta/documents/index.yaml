- uuid: lyDItk0IFU
  name: Revise tab 2 to the scientist's phase definitions, organise by block context,
    Kruskal-Wallis + post-hoc trial-shuffle test, redesigned plots and layout.
  mime_type: text/markdown
  url: file:///Users/pavir/Code/dr-interactive-interface/work/rule-change-windows-v2/README.md
  summary: 'Instruction = trials 0-4, early = 5-14, late = last 10 of each block;
    context = rewarded modality. Rule-updating unit = instruction mean rate > early
    and > late (default set, 3,532 units); Kruskal-Wallis with within-block trial-label-shuffle
    null plus post-hoc contrasts as optional tiers (841 at p<0.05); BH on hold. App:
    sidebar layout, block timeline, all-blocks raster with context labels, instruction/early/late
    PSTH, live permutation null, region table with null expectation.'
  tags:
  - asta-assistant
  - work
  - rule-change-windows-v2
  created_at: '2026-09-15T18:55:43.311423+00:00'
  modified_at: '2026-09-15T18:55:43.311423+00:00'
